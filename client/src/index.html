<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Dialer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
      // Apply the saved theme (or the device's) before the app draws, so a reload never
      // flashes the wrong one. ThemeService keeps it in sync afterwards.
      (function () {
        var choice = 'system';
        try {
          choice = JSON.parse(localStorage.getItem('dialer.theme')) || 'system';
        } catch (e) {}
        if (choice !== 'light' && choice !== 'dark') {
          choice = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = choice;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
