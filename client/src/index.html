<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Dialer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The Dialer logo: SVG for modern browsers, ICO for older ones, PNG for phone home screens.
         Bump ?v= when the logo changes: browsers cache favicons separately and keep old ones. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <link rel="manifest" href="manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- Applies the saved theme before the app draws (see the file); not inline, for the CSP. -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
