<ul class="flex flex-col">
  @for (contact of contacts; track contact.id) {
  <li class="border-b border-divider last:border-b-0">
    <button
      type="button"
      class="w-full text-left -mx-2 px-2 rounded-xl hover:bg-surface transition cursor-pointer"
      (click)="contactSelected.emit(contact)"
    >
      <app-contact-item [contact]="contact" [showPhone]="showPhone"></app-contact-item>
    </button>
  </li>
  }
</ul>
