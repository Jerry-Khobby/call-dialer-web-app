<button
  type="button"
  class="w-[78px] h-[78px] rounded-full bg-raised text-fg flex flex-col items-center justify-center hover:brightness-110 active:brightness-125 transition cursor-pointer select-none touch-manipulation"
  [attr.aria-label]="letters ? label + ' ' + letters : label"
  data-keypad-key
  appLongPress
  (appTap)="clicked.emit(label)"
  (appLongPress)="longPressed.emit(label)"
>
  @if (isSymbol) {
  <!-- * and # have no letters, so they sit in the middle of the circle like on a phone. -->
  <span [class]="symbolClass">{{ label }}</span>
  } @else {
  <span class="font-display text-[32px] font-semibold leading-none">{{ label }}</span>
  <span class="text-[10px] font-semibold tracking-[0.18em] h-3 mt-0.5 text-muted">{{ letters }}</span>
  }
</button>
