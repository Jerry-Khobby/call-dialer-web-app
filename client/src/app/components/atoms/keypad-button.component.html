<button
  type="button"
  class="w-[4.5rem] h-[4.5rem] rounded-full bg-white/10 backdrop-blur-sm text-white flex flex-col items-center justify-center active:bg-white/25 hover:bg-white/15 transition cursor-pointer select-none touch-manipulation"
  [attr.aria-label]="letters ? label + ' ' + letters : label"
  data-keypad-key
  appLongPress
  (appTap)="clicked.emit(label)"
  (appLongPress)="longPressed.emit(label)"
>
  @if (isSymbol) {
  <!-- * and # have no letters, so they sit in the middle of the circle like on a phone. -->
  <span [class]="symbolClass">{{ label }}</span>
  } @else {
  <span class="text-3xl leading-none">{{ label }}</span>
  <span class="text-[10px] font-semibold tracking-[0.2em] h-3 mt-0.5 opacity-70">{{ letters }}</span>
  }
</button>
