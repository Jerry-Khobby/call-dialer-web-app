<div
  class="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-xl backdrop-blur-sm border border-white/10 w-full focus-within:border-blue-400/60 transition"
>
  <mat-icon fontIcon="search" class="text-gray-400 icon-sm"></mat-icon>

  <input
    type="search"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder"
    [(ngModel)]="search"
    (ngModelChange)="searchChange.emit($event)"
    class="bg-transparent text-white placeholder-gray-500 outline-none flex-1 text-[14px] [&::-webkit-search-cancel-button]:hidden"
  />

  @if (search) {
  <button
    type="button"
    class="flex items-center text-gray-400 hover:text-white cursor-pointer"
    aria-label="Clear search"
    (click)="clear()"
  >
    <mat-icon fontIcon="cancel" class="icon-sm"></mat-icon>
  </button>
  }
</div>
