<div class="relative flex h-11 w-full items-center rounded-xl bg-chip focus-within:ring-2 focus-within:ring-link/60 transition">
  <mat-icon fontIcon="search" class="icon-sm absolute left-3.5" style="color: var(--c-subtle)" aria-hidden="true"></mat-icon>

  <input
    type="search"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder"
    [(ngModel)]="search"
    (ngModelChange)="searchChange.emit($event)"
    class="h-full w-full bg-transparent pl-10 pr-10 text-[15px] font-medium text-fg outline-none [&::-webkit-search-cancel-button]:hidden"
  />

  @if (search) {
  <button
    type="button"
    class="absolute right-1 flex h-9 w-9 items-center justify-center rounded-full text-subtle hover:text-fg cursor-pointer"
    aria-label="Clear search"
    (click)="clear()"
  >
    <mat-icon fontIcon="cancel" class="icon-sm"></mat-icon>
  </button>
  }
</div>
