<div class="flex items-center gap-3 py-2.5">
  <app-avatar [initials]="initials(contact)"></app-avatar>
  <div class="flex flex-col min-w-0">
    <span class="text-base font-medium text-fg truncate">{{ fullName(contact) }}</span>
    @if (showPhone) {
    <span class="text-[13px] text-muted">{{ formatPhone(contact.phoneNumber) }}</span>
    }
  </div>
</div>
