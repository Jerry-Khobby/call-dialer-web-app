<div class="flex items-center gap-3 py-2">
  <app-avatar [initials]="initials(contact)"></app-avatar>
  <div class="flex flex-col min-w-0">
    <span class="text-white text-[15px] font-medium truncate">{{ fullName(contact) }}</span>
    @if (showPhone) {
    <span class="text-gray-400 text-sm">{{ formatPhone(contact.phoneNumber) }}</span>
    }
  </div>
</div>
