@if (notification(); as n) {
<div class="notification-container" role="status" aria-live="polite">
  <div
    class="flex items-center gap-3 rounded-2xl border border-line bg-sheet pl-3 pr-2 py-2.5 text-sm font-medium text-fg shadow-xl max-w-[22rem]"
  >
    <mat-icon [fontIcon]="severityIcons[n.severity].icon" class="icon-md shrink-0" [style.color]="severityIcons[n.severity].color"></mat-icon>
    <span class="flex-1">{{ n.text }}</span>
    <button
      type="button"
      class="flex h-8 w-8 items-center justify-center rounded-full text-muted hover:bg-chip hover:text-fg cursor-pointer"
      aria-label="Dismiss notification"
      (click)="onClose()"
    >
      <mat-icon fontIcon="close" class="icon-sm"></mat-icon>
    </button>
  </div>
</div>
}
