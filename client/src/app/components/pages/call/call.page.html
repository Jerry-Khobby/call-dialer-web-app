@if (call(); as call) {
<main
  class="min-h-screen bg-gradient-to-b from-[#1b1b20] to-[#0f0f11] text-white flex flex-col items-center justify-between py-16 px-4"
>
  <!-- Who and status -->
  <div class="flex flex-col items-center text-center gap-2">
    @if (showKeypad()) {
    <h1 class="text-xl font-medium">{{ title() }}</h1>
    <p class="text-4xl tracking-wider h-12 mt-2" aria-live="polite">{{ call.tones }}</p>
    } @else {
    <app-avatar [initials]="avatarInitials()" [size]="96"></app-avatar>
    <h1 class="text-3xl font-semibold mt-2">{{ title() }}</h1>
    @if (contact()) {
    <p class="text-gray-400">{{ formatPhone(call.phoneNumber) }}</p>
    }
    }
    <p class="text-gray-300 text-sm tabular-nums" aria-live="polite">{{ status() }}</p>
  </div>

  <!-- Controls or in-call keypad -->
  @if (showKeypad()) {
  <app-keypad (press)="calls.sendTone($event)"></app-keypad>
  } @else {
  <app-call-controls
    [muted]="call.muted"
    [speaker]="call.speaker"
    [disabled]="call.status === 'ended'"
    (muteToggled)="calls.toggleMute()"
    (speakerToggled)="calls.toggleSpeaker()"
    (keypadOpened)="showKeypad.set(true)"
  ></app-call-controls>
  }

  <!-- End call (+ hide keypad) -->
  <div class="grid grid-cols-3 gap-x-8 place-items-center w-full max-w-xs">
    <span></span>
    <button
      type="button"
      (click)="calls.hangUp()"
      [disabled]="call.status === 'ended'"
      class="bg-red-600 hover:bg-red-500 disabled:opacity-50 transition text-white rounded-full w-[4.5rem] h-[4.5rem] flex items-center justify-center cursor-pointer"
      aria-label="End call"
    >
      <mat-icon fontIcon="call_end" class="icon-lg"></mat-icon>
    </button>
    @if (showKeypad()) {
    <button type="button" class="text-white/90 hover:text-white cursor-pointer" (click)="showKeypad.set(false)">
      Hide
    </button>
    }
  </div>
</main>
}
