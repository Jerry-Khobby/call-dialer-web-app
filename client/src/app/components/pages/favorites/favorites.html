<main class="screen">
  <h1 class="screen-title pt-9">Favorites</h1>

  <ul class="mt-3">
    @for (contact of favorites(); track contact.id) {
    <li class="flex items-center gap-1 border-b border-divider last:border-b-0">
      <button
        type="button"
        class="-mx-2 min-w-0 flex-1 rounded-xl px-2 text-left hover:bg-surface transition cursor-pointer"
        [attr.aria-label]="'Call ' + fullName(contact)"
        (click)="call(contact)"
      >
        <app-contact-item [contact]="contact"></app-contact-item>
      </button>
      <a
        [routerLink]="['/contacts', contact.id]"
        class="-mr-2 flex h-11 w-11 items-center justify-center text-link"
        [attr.aria-label]="'Details for ' + fullName(contact)"
      >
        <mat-icon fontIcon="info_outline" class="icon-md"></mat-icon>
      </a>
    </li>
    } @empty { @if (loaded()) {
    <li class="flex flex-col items-center gap-3 py-16 text-center">
      <span class="flex h-16 w-16 items-center justify-center rounded-full bg-chip text-star">
        <mat-icon fontIcon="star_border" class="icon-lg"></mat-icon>
      </span>
      <p class="font-display text-xl font-bold">No favorites yet</p>
      <p class="max-w-64 text-sm text-muted">Open a contact and tap the star to keep them one tap away.</p>
      <a routerLink="/contacts" class="mt-1 font-semibold text-link hover:underline">Go to Contacts</a>
    </li>
    } }
  </ul>
</main>

<app-tab-bar></app-tab-bar>
