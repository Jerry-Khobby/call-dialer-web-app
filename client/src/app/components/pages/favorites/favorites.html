<main class="min-h-screen bg-[#0f0f11] text-white flex flex-col items-center pb-32">
  <div class="w-full max-w-sm px-4 flex flex-col gap-4 pt-16">
    <h1 class="text-2xl font-bold">Favorites</h1>

    <ul class="flex flex-col divide-y divide-white/5 overflow-y-auto max-h-[68vh] custom-scroll">
      @for (contact of favorites(); track contact.id) {
      <li class="flex items-center gap-2">
        <button
          type="button"
          class="flex-1 min-w-0 text-left px-2 rounded-lg hover:bg-white/5 transition cursor-pointer"
          [attr.aria-label]="'Call ' + fullName(contact)"
          (click)="call(contact)"
        >
          <app-contact-item [contact]="contact"></app-contact-item>
        </button>
        <a
          [routerLink]="['/contacts', contact.id]"
          class="text-blue-400 hover:text-blue-300 p-2 flex"
          [attr.aria-label]="'Details for ' + fullName(contact)"
        >
          <mat-icon fontIcon="info_outline"></mat-icon>
        </a>
      </li>
      } @empty {
      <li class="flex flex-col items-center text-center gap-3 py-16 text-gray-400">
        <mat-icon fontIcon="star_border" class="icon-xl opacity-60"></mat-icon>
        <p class="text-lg text-white">No Favorites</p>
        <p class="text-sm">Open a contact and tap the star to add it here.</p>
        <a routerLink="/contacts" class="text-blue-400 hover:text-blue-300">Go to Contacts</a>
      </li>
      }
    </ul>
  </div>
</main>

<app-tab-bar></app-tab-bar>
