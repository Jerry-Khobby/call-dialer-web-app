<main class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm flex flex-col gap-6">
    <div class="flex flex-col items-center gap-3 text-center">
      <div class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center shadow-lg">
        <mat-icon fontIcon="phone" class="icon-lg"></mat-icon>
      </div>
      <h1 class="text-2xl font-bold">Log in to Dialer</h1>
      <p class="text-sm text-gray-400">Free calls to anyone else on Dialer.</p>
    </div>

    <form class="flex flex-col gap-3" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="sr-only">Email</span>
        <input
          type="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </label>
      <label class="field">
        <span class="sr-only">Password</span>
        <input
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </label>

      @if (error()) {
      <p class="text-sm text-red-400" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary mt-2" [disabled]="busy()">
        {{ busy() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-400">
      New to Dialer?
      <a routerLink="/register" [queryParams]="{ returnUrl }" class="text-blue-400 hover:text-blue-300">
        Create an account
      </a>
    </p>
  </div>
</main>
