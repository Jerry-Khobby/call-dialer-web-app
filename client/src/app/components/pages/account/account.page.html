<main class="min-h-screen bg-[#0f0f11] text-white flex flex-col items-center pb-32">
  <div class="w-full max-w-sm px-4 pt-10">
    <div class="flex items-center mb-6">
      <a routerLink="/contacts" class="flex items-center text-blue-400 hover:text-blue-300">
        <mat-icon fontIcon="chevron_left"></mat-icon>
        Contacts
      </a>
    </div>

    @if (user(); as me) {
    <div class="flex flex-col items-center gap-3">
      <app-avatar [initials]="initials()" [size]="96"></app-avatar>
      <h1 class="text-3xl font-semibold text-center">{{ me.fullName }}</h1>
      <p class="text-xs uppercase tracking-wider text-gray-500">My Card</p>
    </div>

    <div class="mt-6 rounded-2xl bg-white/5 divide-y divide-white/10">
      <div class="px-4 py-3">
        <span class="block text-xs text-gray-400">my number</span>
        <span class="text-lg">{{ formatPhone(me.phoneNumber) }}</span>
        <span class="block text-xs text-gray-500 mt-1">Other Dialer users call you on this number.</span>
      </div>
      <div class="px-4 py-3">
        <span class="block text-xs text-gray-400">email</span>
        <span>{{ me.email }}</span>
      </div>
    </div>

    <button
      type="button"
      class="w-full mt-4 rounded-2xl bg-white/5 hover:bg-white/10 px-4 py-3 text-red-400 transition cursor-pointer"
      (click)="logout()"
    >
      Log Out
    </button>
    }
  </div>
</main>

<app-tab-bar></app-tab-bar>
