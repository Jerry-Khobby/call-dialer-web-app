<main class="mx-auto flex min-h-screen w-full max-w-md flex-col items-center justify-center px-4 pt-10 pb-28">
  <!-- Number Display -->
  <div
    class="flex h-12 max-w-full items-center justify-center overflow-hidden whitespace-nowrap font-display text-[38px] font-bold tracking-wide"
    [class.pop]="isPopping"
    aria-live="polite"
    aria-label="Number"
  >
    {{ formattedNumber() }}
  </div>

  <!-- Contact name or "Add Number" (fixed height so the keypad doesn't jump) -->
  <div class="mt-3 mb-6 flex h-8 items-center justify-center">
    @if (matchedContact(); as contact) {
    <a
      [routerLink]="['/contacts', contact.id]"
      class="flex h-8 items-center gap-2 rounded-full bg-chip pl-1.5 pr-3 text-sm font-medium text-label hover:text-fg"
    >
      <app-avatar [initials]="initials(contact)" [size]="22"></app-avatar>
      {{ fullName(contact) }} · mobile
    </a>
    } @else if (typedNumber()) {
    <button
      type="button"
      (click)="showAddOptions.set(true)"
      class="flex h-8 items-center gap-1 rounded-full px-3 text-sm font-semibold text-link hover:bg-link-soft cursor-pointer"
    >
      <mat-icon fontIcon="person_add" class="icon-sm"></mat-icon>
      Add Number
    </button>
    }
  </div>

  <app-keypad (press)="addDigit($event)"></app-keypad>

  <!-- CALL + DELETE -->
  <div class="mt-[22px] grid w-[286px] grid-cols-3 place-items-center gap-x-[26px]">
    <span></span>
    <button
      type="button"
      class="flex h-[78px] w-[78px] items-center justify-center rounded-full bg-accent text-on-accent shadow-lg hover:brightness-105 active:scale-95 transition cursor-pointer"
      aria-label="Call"
      (click)="callThisNumber()"
    >
      <mat-icon fontIcon="call" class="icon-lg"></mat-icon>
    </button>

    @if (typedNumber()) {
    <button
      type="button"
      class="flex h-14 w-14 items-center justify-center rounded-full text-muted hover:text-fg cursor-pointer select-none"
      aria-label="Delete digit (hold to clear)"
      appLongPress
      (appTap)="clearLastDigit()"
      (appLongPress)="clearAll()"
    >
      <mat-icon fontIcon="backspace" class="icon-lg"></mat-icon>
    </button>
    }
  </div>
</main>

<!-- "Add Number" action sheet -->
@if (showAddOptions()) {
<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-scrim p-3 backdrop-blur-sm"
  (click)="showAddOptions.set(false)"
>
  <div
    class="flex w-full max-w-sm flex-col gap-2 animate-sheet"
    role="dialog"
    aria-label="Add number"
    (click)="$event.stopPropagation()"
  >
    <div class="divide-y divide-divider overflow-hidden rounded-2xl bg-sheet">
      <button type="button" class="sheet-btn" (click)="createNewContact()">Create New Contact</button>
      <button type="button" class="sheet-btn" (click)="addToExistingContact()">Add to Existing Contact</button>
    </div>
    <button type="button" class="sheet-btn rounded-2xl bg-sheet font-semibold" (click)="showAddOptions.set(false)">
      Cancel
    </button>
  </div>
</div>
}

<app-tab-bar></app-tab-bar>
