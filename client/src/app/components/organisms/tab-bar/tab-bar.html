<nav
  class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-md shadow-lg rounded-3xl px-3 py-2 flex justify-between gap-1 sm:gap-3 border border-white/10 z-40"
  aria-label="Main"
>
  @for (tab of tabs; track tab.path) {
  <a
    [routerLink]="tab.path"
    routerLinkActive="active-tab"
    [routerLinkActiveOptions]="{ exact: false }"
    ariaCurrentWhenActive="page"
    class="tab-item"
  >
    <mat-icon [fontIcon]="tab.icon" class="text-2xl"></mat-icon>
    <span class="text-xs">{{ tab.label }}</span>
  </a>
  }
</nav>
