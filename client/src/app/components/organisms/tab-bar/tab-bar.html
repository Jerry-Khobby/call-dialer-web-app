<nav
  class="fixed inset-x-0 bottom-0 z-40 border-t border-nav-line bg-nav/95 backdrop-blur pb-[max(env(safe-area-inset-bottom),12px)]"
  aria-label="Main"
>
  <div class="mx-auto grid max-w-md grid-cols-4 px-2 pt-2">
    @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      routerLinkActive="active-tab"
      [routerLinkActiveOptions]="{ exact: false }"
      ariaCurrentWhenActive="page"
      class="tab-item h-12"
    >
      <mat-icon [fontIcon]="tab.icon" class="icon-md"></mat-icon>
      <span>{{ tab.label }}</span>
    </a>
    }
  </div>
</nav>
